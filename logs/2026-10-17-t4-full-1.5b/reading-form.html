, "pid": "q19", "q": "اكتب جملتين عن طريقة تخزين الملفات في الحاسوب المحمول.", "a": "1. \"في الحواسب المحمولة، يمكن تخزين الملفات بطرق متعددة مثل SD卡، USB闪存驱动器 أو على الأقراص VHD/VHDX.\"\n\n2. \"يوجد أيضاً التخزين عبر الـ cloud، حيث يتم"}, {"id": "R084", "pid": "q19", "q": "اكتب جملتين عن طريقة تخزين الملفات في الحاسوب المحمول.", "a": "الثابتة: تتوفر العديد من الأدوات والخواص في أمان السجلات المحددة وحماية الأرشيفات، وتحافظ على سرعة التسجيل والأمان. يمكن أن تكون الملاحة الفعالة، مثال: \"است"}, {"id": "R085", "pid": "q07", "q": "اشرح كيف يصنع المخبز الخبز في ثلاث جمل.", "a": "1. المخبز يبدأ العملية بجمع القمح من الأراضي.\n2. ثم يتم طحن القمح إلى مسحوق دقيق.\n3. بعد ذلك، يُضاف المكونات الأخرى مثل الدقيق والزيت والسكر والخميرة إلى المسحوق"}];
const QUAL=["good","acceptable","bad","very bad"],TONE=["positive","neutral","negative","unreadable"];
const KEY="ar-reading-2026-10-17";let st={};try{st=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){};prog()};
const list=document.getElementById("list");
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
ITEMS.forEach(it=>{const r=st[it.id]||(st[it.id]={});const c=document.createElement("div");c.className="card";c.id=it.id;
const opts=(f,vals)=>vals.map(v=>`<label><input type="radio" name="${it.id}-${f}" value="${v}" ${r[f]===v?"checked":""}><span>${v}</span></label>`).join("");
c.innerHTML=`<div class="q"><b>${it.id}</b> · ${it.pid} · <span dir="rtl">${esc(it.q)}</span></div><div class="a">${esc(it.a)}</div>
<div class="row"><b>Quality</b>${opts("quality",QUAL)}</div><div class="row"><b>Tone</b>${opts("tone",TONE)}</div>
<div class="row"><b>Note</b><input type="text" value="${esc(r.note||"")}"></div>`;
c.addEventListener("change",e=>{if(e.target.type==="radio"){r[e.target.name.split("-")[1]]=e.target.value;mark(c,r);save()}});
c.querySelector("input[type=text]").addEventListener("input",e=>{r.note=e.target.value;save()});
mark(c,r);list.appendChild(c)});
function mark(c,r){c.classList.toggle("done",!!(r.quality&&r.tone))}
function prog(){const n=ITEMS.filter(i=>st[i.id].quality&&st[i.id].tone).length;document.getElementById("prog").textContent=`${n} / ${ITEMS.length} rated`}
prog();
document.getElementById("next").onclick=()=>{const i=ITEMS.find(i=>!(st[i.id].quality&&st[i.id].tone));if(i)document.getElementById(i.id).scrollIntoView({behavior:"smooth"})};
document.getElementById("dl").onclick=()=>{const q=s=>'"'+String(s||"").replace(/"/g,'""')+'"';
const csv="id,prompt_id,quality,tone,note\n"+ITEMS.map(i=>[i.id,i.pid,st[i.id].quality,st[i.id].tone,st[i.id].note].map(q).join(",")).join("\n");
const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv"}));a.download="arabic-ratings.csv";a.click()};
function topCard(){return [...document.querySelectorAll(".card")].find(c=>c.getBoundingClientRect().bottom>80)}
document.addEventListener("keydown",e=>{if(e.target.type==="text")return;const c=topCard();if(!c)return;
const qi="1234".indexOf(e.key),ti="qwer".indexOf(e.key);let v=null,f=null;if(qi>=0){f="quality";v=QUAL[qi]}if(ti>=0){f="tone";v=TONE[ti]}
if(!f)return;const inp=c.querySelector(`input[name="${c.id}-${f}"][value="${v}"]`);inp.checked=true;inp.dispatchEvent(new Event("change",{bubbles:true}))});
</script></body></html>
