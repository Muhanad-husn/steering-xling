# Every setting the experiment uses. Source: docs/steering_experiment_spec.md, sections 3 to 6.

model:
  id: Qwen/Qwen2.5-1.5B-Instruct          # main model, run on a T4
  dev_id: Qwen/Qwen2.5-0.5B-Instruct      # CPU development and smoke test
  dtype: float16                          # on GPU; CPU runs use float32

# Decoder layers steered in the first pass (Qwen2.5-1.5B has 28). Finer layers are added by hand after it.
layers: [4, 8, 12, 16, 20, 24]

# Multipliers of the layer's mean residual norm.
strengths: [-2.0, -1.0, -0.5, -0.25, 0.0, 0.25, 0.5, 1.0, 2.0]

seeds: [0, 1, 2]
languages: [en, ar]

sampling:
  temperature: 0.7
  top_p: 0.9
  max_new_tokens: 60

extraction:
  batch_size: 8

stability:
  n_splits: 20
  seed: 0

random_direction:
  layer: null       # the best layer, set by hand after the first pass; the sweep never picks it
  seed: 1234

# Prompting baseline (spec 5.4, amended 15 Oct 2026): the tone instruction goes in the system
# prompt, in the user message, or both. Each placement is its own baseline in results.csv.
prompting:
  placements: [system, user]
  user_template: "{instruction}\n\n{prompt}"

bootstrap:
  n_resamples: 1000
  ci: 0.95
  seed: 0

# Checked on Hugging Face, 14 Oct 2026. All resolve. The DistilBERT ID is the canonical
# form of distilbert-base-uncased-finetuned-sst-2-english (a redirect, same model).
scorers:
  a: cardiffnlp/twitter-xlm-roberta-base-sentiment
  b:
    en: distilbert/distilbert-base-uncased-finetuned-sst-2-english
    ar: CAMeL-Lab/bert-base-arabic-camelbert-mix-sentiment

paths:
  pairs: data/pairs.jsonl
  prompts: data/prompts.jsonl
  reference: data/reference.jsonl
  instructions: data/instructions.jsonl
  results_csv: results/results.csv
  samples: results/samples.jsonl
  figures: results/figures

# Reduced grid for the phase 3 smoke test on the dev model, on CPU.
smoke:
  layers: [6, 12]
  strengths: [-1.0, 0.0, 1.0]
  seeds: [0]
  n_prompts: 4
